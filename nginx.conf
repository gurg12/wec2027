# Drop this file at /etc/nginx/sites-available/wec2027
# then: sudo ln -s /etc/nginx/sites-available/wec2027 /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;          # replace with your domain or Lightsail static IP

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Proxy all /api traffic to Node
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve the built React app
    location / {
        root   /var/www/wec2027/client/dist;
        index  index.html;
        try_files $uri $uri/ /index.html;    # client-side routing
    }
}
